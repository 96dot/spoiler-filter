<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoVice</title>
    <link rel="stylesheet" href="styles/popup.css" />
  </head>

  <body>
    <header>
      <div class="logo" id="logo"></div>
      <div class="brand">
        <h1>NoVice</h1>
        <p class="tagline" id="count-label"></p>
      </div>
      <span class="stat-number" id="count">0</span>
    </header>

    <main>
      <section class="settings">
        <label class="row">
          <span class="row-text">
            <span class="row-title" data-i18n="protection"></span>
            <span class="row-hint" id="enabled-hint"></span>
          </span>
          <input type="checkbox" class="switch" id="enabled" />
        </label>

        <div class="row">
          <span class="row-text">
            <span class="row-title" data-i18n="style"></span>
          </span>
          <div class="segmented" id="style">
            <input type="radio" name="style" id="style-blur" value="blur" />
            <label for="style-blur" data-i18n="styleBlur"></label>
            <input type="radio" name="style" id="style-hide" value="hide" />
            <label for="style-hide" data-i18n="styleHide"></label>
          </div>
        </div>

        <label class="row">
          <span class="row-text">
            <span class="row-title" data-i18n="strict"></span>
            <span class="row-hint" data-i18n="strictHint"></span>
          </span>
          <input type="checkbox" class="switch" id="strict" />
        </label>

        <label class="row" id="site-row">
          <span class="row-text">
            <span class="row-title" data-i18n="site"></span>
            <span class="row-hint" id="site-host"></span>
          </span>
          <input type="checkbox" class="switch" id="site" />
        </label>
      </section>

      <section class="keywords">
        <div class="row-text">
          <span
            class="row-title"
            id="keywords-title"
            data-i18n="keywords"
          ></span>
          <span class="row-hint" data-i18n="keywordsHint"></span>
        </div>
        <form class="keyword-form" id="keyword-form">
          <input
            type="text"
            id="keyword-input"
            aria-labelledby="keywords-title"
            maxlength="60"
            autocomplete="off"
            spellcheck="false"
          />
          <button
            type="submit"
            id="keyword-add"
            data-i18n="keywordAdd"
          ></button>
        </form>
        <ul class="chips" id="keyword-list"></ul>
        <details>
          <summary data-i18n="keywordImport"></summary>
          <form class="import-form" id="import-form">
            <label
              class="row-hint"
              for="import-input"
              data-i18n="importHint"
            ></label>
            <textarea id="import-input" rows="4" spellcheck="false"></textarea>
            <label
              class="row-hint"
              for="import-file"
              data-i18n="importFile"
            ></label>
            <input type="file" id="import-file" accept=".txt,text/plain" />
            <button
              type="submit"
              id="import-add"
              data-i18n="keywordImport"
            ></button>
          </form>
        </details>
        <p
          class="row-hint feedback"
          id="import-status"
          role="status"
          aria-live="polite"
        ></p>
      </section>

      <section class="keywords">
        <div class="row-text">
          <label
            class="row-title"
            for="domain-input"
            data-i18n="excludedSites"
          ></label>
          <span
            class="row-hint"
            id="domain-hint"
            data-i18n="excludedSitesHint"
          ></span>
        </div>
        <form class="keyword-form" id="domain-form">
          <input
            type="text"
            id="domain-input"
            placeholder="example.com"
            aria-describedby="domain-hint"
            autocomplete="off"
            spellcheck="false"
            required
          />
          <button type="submit" id="domain-add" data-i18n="keywordAdd"></button>
        </form>
        <ul class="chips" id="domain-list"></ul>
        <p
          class="row-hint feedback"
          id="domain-status"
          role="status"
          aria-live="polite"
        ></p>
      </section>
    </main>

    <footer>
      <div class="footer-links">
        <span id="version"></span>
        <a
          href="https://github.com/kpulka247/novice/issues"
          target="_blank"
          data-i18n="reportIssue"
        ></a>
      </div>
      <a class="coffee" href="https://ko-fi.com/kpulka" target="_blank">
        <span id="coffee-cup"></span>
        <span data-i18n="support"></span>
      </a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
